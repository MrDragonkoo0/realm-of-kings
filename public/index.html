<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1019">
<title>Realm of Kings v0.8</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="registration" style="display:none"><h1>♛ REALM OF KINGS</h1><p>Середньовічний світ чекає на свого правителя.</p><div id="step1"><h2>🏰 Назва королівства</h2><input id="kingdomName" maxlength="32" placeholder="Назва королівства"><button onclick="nextStep()">Далі ➜</button></div><div id="step2" style="display:none"><h2>👑 Ім'я правителя</h2><input id="rulerName" maxlength="32" placeholder="Ім'я правителя"><button onclick="createKingdom()">Створити королівство</button></div></div>
<main id="game"></main>
<nav id="bottomNav" aria-label="Головна навігація" style="display:none">
<button data-tab="home" class="active" onclick="navTo('home')"><span>⌂</span><small>Головна</small></button>
<button data-tab="kingdom" onclick="navTo('kingdom')"><span>♜</span><small>Королівство</small></button>
<button data-tab="map" onclick="navTo('map')"><span>◇</span><small>Світ</small></button>
<button data-tab="messages" onclick="navTo('messages')"><span>✉</span><small>Хроніки</small></button>
<button data-tab="profile" onclick="navTo('profile')"><span>♙</span><small>Профіль</small></button>
</nav>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="script.js"></script>
</body></html>
