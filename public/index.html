<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1019">
<title>Realm of Kings v0.10</title>
<link rel="stylesheet" href="style.css?v=0.10.0">
</head>
<body>
<div id="registration" style="display:none"><h1>♛ REALM OF KINGS</h1><p>Середньовічний світ чекає на свого правителя.</p><div id="step1"><h2>🏰 Назва королівства</h2><input id="kingdomName" maxlength="32" placeholder="Назва королівства"><button onclick="nextStep()">Далі ➜</button></div><div id="step2" style="display:none"><h2>👑 Ім'я правителя</h2><input id="rulerName" maxlength="32" placeholder="Ім'я правителя"><button onclick="createKingdom()">Створити королівство</button></div></div>
<main id="game"></main>
<nav id="bottomNav" aria-label="Головна навігація" style="display:none">
<button data-tab="home" class="active" onclick="navTo('home')" aria-label="Головна"><img src="ui/navigation/home_active.png" data-normal="ui/navigation/home_normal.png" data-active="ui/navigation/home_active.png" data-disabled="ui/navigation/home_disabled.png" alt="Головна" onerror="this.hidden=true;this.parentElement.classList.add('asset-fallback')"></button>
<button data-tab="kingdom" onclick="navTo('kingdom')" aria-label="Королівство"><img src="ui/navigation/kingdom_normal.png" data-normal="ui/navigation/kingdom_normal.png" data-active="ui/navigation/kingdom_active.png" data-disabled="ui/navigation/kingdom_disabled.png" alt="Королівство" onerror="this.hidden=true;this.parentElement.classList.add('asset-fallback')"></button>
<button data-tab="map" onclick="navTo('map')" aria-label="Мапа"><img src="ui/navigation/map_normal.png" data-normal="ui/navigation/map_normal.png" data-active="ui/navigation/map_active.png" data-disabled="ui/navigation/map_disabled.png" alt="Мапа" onerror="this.hidden=true;this.parentElement.classList.add('asset-fallback')"></button>
<button data-tab="messages" onclick="navTo('messages')" aria-label="Хроніки"><img src="ui/navigation/messages_normal.png" data-normal="ui/navigation/messages_normal.png" data-active="ui/navigation/messages_active.png" data-disabled="ui/navigation/messages_disabled.png" alt="Хроніки"></button>
<button data-tab="profile" onclick="navTo('profile')" aria-label="Профіль"><img src="ui/navigation/profile_normal.png" data-normal="ui/navigation/profile_normal.png" data-active="ui/navigation/profile_active.png" data-disabled="ui/navigation/profile_disabled.png" alt="Профіль" onerror="this.hidden=true;this.parentElement.classList.add('asset-fallback')"></button>
</nav>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="script.js?v=0.10.0"></script>
</body></html>
