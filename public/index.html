<head>

<body>
<div id="registration" style="display:none"><h1>♛ REALM OF KINGS</h1><p>Середньовічний світ чекає на свого правителя.</p><div id="step1"><h2>🏰 Назва королівства</h2><input id="kingdomName" maxlength="32" placeholder="Назва королівства"><button onclick="nextStep()">Далі ➜</button></div><div id="step2" style="display:none"><h2>👑 Ім'я правителя</h2><input id="rulerName" maxlength="32" placeholder="Ім'я правителя"><button onclick="createKingdom()">Створити королівство</button></div></div>
<main id="game"></main>
<nav id="bottomNav" aria-label="Головна навігація" style="display:none">
<button data-tab="home" class="active" onclick="navTo('home')" aria-label="Головна"><img src="/ui/navigation/home/active.png" data-normal="/ui/navigation/home/normal.png" data-active="/ui/navigation/home/active.png" data-disabled="/ui/navigation/home/disabled.png" alt="Головна"></button>
<button data-tab="kingdom" onclick="navTo('kingdom')" aria-label="Королівство"><img src="/ui/navigation/kingdom/normal.png" data-normal="/ui/navigation/kingdom/normal.png" data-active="/ui/navigation/kingdom/active.png" data-disabled="/ui/navigation/kingdom/disabled.png" alt="Королівство"></button>
<button data-tab="map" onclick="navTo('map')" aria-label="Мапа"><img src="/ui/navigation/map/normal.png" data-normal="/ui/navigation/map/normal.png" data-active="/ui/navigation/map/active.png" data-disabled="/ui/navigation/map/disabled.png" alt="Мапа"></button>
<button data-tab="messages" onclick="navTo('messages')" aria-label="Хроніки"><img src="/ui/navigation/messages/normal.png" data-normal="/ui/navigation/messages/normal.png" data-active="/ui/navigation/messages/active.png" data-disabled="/ui/navigation/messages/disabled.png" alt="Хроніки"></button>
<button data-tab="profile" onclick="navTo('profile')" aria-label="Профіль"><img src="/ui/navigation/profile/normal.png" data-normal="/ui/navigation/profile/normal.png" data-active="/ui/navigation/profile/active.png" data-disabled="/ui/navigation/profile/disabled.png" alt="Профіль"></button>
</nav>
