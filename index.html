<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Kings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <h1>🏰 МОЄ КОРОЛІВСТВО 🏰</h1>

    <img src="castle.png" class="castle" alt="Замок">

    <div class="kingdom-info">

        <h2>🏰 Dragon Kingdom</h2>

        <p>👑 Правитель: <b>Саша</b></p>
        <p>📈 Рівень: <b>1</b></p>

        <hr>

        <p>👥 Населення: <b>0</b></p>
        <p>🏘️ Міста: <b>0</b></p>
        <p>🏠 Села: <b>0</b></p>

        <hr>

        <p>💰 Казна: <b>0 🪙</b></p>
        <p>💎 Дорогоцінні каміння: <b>0</b></p>

        <hr>

        <p>💪 Військова сила: <b>0</b></p>

    </div>


    <div class="menu">

        <button onclick="showCities()">
            🏘️
            <span>Міста</span>
        </button>

        <button>
            🏠
            <span>Села</span>
        </button>

        <button onclick="showArmy()">
            ⚔️
            <span>Війська</span>
        </button>

        <button>
            💰
            <span>Казна</span>
        </button>

        <button>
            👥
            <span>Населення</span>
        </button>

        <button onclick="showWarehouse()">
            📦
            <span>Склад</span>
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
