<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realm of Kings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- Заголовок -->
    <div class="title">
        🏰 МОЄ КОРОЛІВСТВО 🏰
    </div>

    <!-- Інформація -->
    <div class="kingdom">

        <h2>🏰 Dragon Kingdom</h2>

        <p>👑 Правитель: <b>Саша</b></p>

        <div class="level">
            <span>Рівень 1</span>
            <div class="xp">
                <div class="xp-fill"></div>
            </div>
            <small>0 / 100 XP</small>
        </div>

    </div>

    <!-- Статистика -->
    <div class="stats">

        <div class="stat">
            <h3>👥 Населення</h3>
            <p>0</p>

            <hr>

            <h3>🏘️ Міста</h3>
            <p>0</p>

            <hr>

            <h3>🏠 Села</h3>
            <p>0</p>
        </div>


        <div class="stat">
            <h3>💰 Казна</h3>
            <p>0 🪙</p>

            <hr>

            <h3>💎 Дорогоцінні каміння</h3>
            <p>0</p>
        </div>


        <div class="stat">
            <h3>⚔️ Військова сила</h3>
            <p>0</p>
        </div>

    </div>


    <!-- Кнопки -->
    <div class="menu">

        <button class="game-button" onclick="showCities()">
            <img src="cities.png">
        </button>

        <button class="game-button" onclick="showVillages()">
            <img src="villages.png">
        </button>

        <button class="game-button" onclick="showArmy()">
            <img src="army.png">
        </button>

        <button class="game-button" onclick="showTreasury()">
            <img src="treasury.png">
        </button>

        <button class="game-button" onclick="showPopulation()">
            <img src="population.png">
        </button>

        <button class="game-button" onclick="showWarehouse()">
            <img src="warehouse.png">
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
